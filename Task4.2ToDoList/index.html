<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoList</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Petrona:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="MainBar">
      <center>
        <h1>To-Do List</h1>
        <p>Stay organized by planning your tasks one at a time.</p>
      </center>
    </div>
    <div id="TaskBar">
      <input id="DateInput" type="date" />
      <input id="TaskTitle" type="text" />
      <textarea name="TaskDescription" id="Desc"></textarea>
      <button id="Add">Add task</button>
    </div>
    <div id="container"></div>
    <script src="Script.js"></script>
  </body>
</html>
